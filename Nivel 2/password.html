<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>
    <div class="container">
        <h1>Generador de Contraseñas</h1>

        <!-- Longitud -->
         <div class="opcion">
            <label for="longitud">Longitud de la contraseña: <span id="valor-longitud">12</span></label>
            <input type="range" id="longitud" min="8" max="20" value="12">
         </div>

         <!-- Opciones de caracteres -->
        <div class="opcion">
            <input type="checkbox" id="mayusculas" checked>
            <label for="mayusculas">Mayúsculas (A-Z)</label>
        </div>

        <div class="opcion">
            <input type="checkbox" id="minusculas" checked>
            <label for="minusculas">Minúsculas (a-z)</label>
        </div>

        <div class="opcion">
            <input type="checkbox" id="numeros" checked>
            <label for="numeros">Números (0-9)</label>
        </div>

        <div class="opcion">
            <input type="checkbox" id="simbolos" checked>
            <label for="simbolos">Símbolos (!@#$%^&*)</label>
        </div>

        <!-- Botón para generar-->
         <button id="btn-generar">Generar Contraseña</button>

         <!-- Resultado -->
          <div class="resultado">
            <p id="password-generado">Contraseña generada aquí</p>
            <button id="btn-copiar">Copiar Contraseña</button>
          </div>

    <p id="mensaje-copia"></p>
    </div>

    <script src="password.js"></script>
</body>
</html>
